worker_processes 2;
worker_rlimit_nofile 1048576;

events {
    worker_connections 131072;
    multi_accept on;
    use epoll;
}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 100000;
    reset_timedout_connection on;
    server_tokens off;

    upstream benchmark_http {
        server backend:9000;
        keepalive 512;
    }

    server {
        listen 8081 reuseport backlog=65535;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_pass http://benchmark_http;
        }
    }
}

stream {
    access_log off;
    proxy_connect_timeout 2s;
    proxy_timeout 30s;
    proxy_socket_keepalive on;

    upstream benchmark_tcp { server backend:9001; }
    upstream benchmark_udp { server backend:9001; }

    server {
        listen 10001 reuseport backlog=65535;
        proxy_pass benchmark_tcp;
        tcp_nodelay on;
    }

    server {
        listen 10001 udp reuseport;
        proxy_pass benchmark_udp;
        proxy_responses 1;
    }
}

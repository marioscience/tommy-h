services:
  postgres-staging:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}_staging
      POSTGRES_USER: ${POSTGRES_USER}_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}_staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - ragenodes_net_staging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}_staging -d ${POSTGRES_DB}_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mariadb-staging:
    image: mariadb@sha256:de61fed4a40d3842f3ee09944ba52792156cfd9adf489b2cc670fc6ded28df8d
    restart: unless-stopped
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      MYSQL_ROOT_PASSWORD: ${CENTRAL_DB_PASS}
    volumes:
      - mariadb_data_staging:/var/lib/mysql
    ports:
      - "127.0.0.1:3316:3306" # Puerto 3316 para no chocar
    networks:
      ragenodes_net_staging:
        aliases:
          - mariadb

  backend-staging:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-1000}"
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      CONTAINER_PREFIX: ragenodes-staging-
      DOCKER_NETWORK: ragenodes_net_staging
      PORT_BASE_OFFSET: ${STAGING_PORT_BASE_OFFSET:-1000}
      FIVEM_PUBLIC_HOST: ${STAGING_GAME_PUBLIC_HOST:-node1.ragenodes.dev}
      PUBLIC_ENDPOINT_HOST: ${STAGING_PUBLIC_ENDPOINT_HOST:-ragenodes.dev}
      PUBLIC_ENDPOINT_SCHEME: ${PUBLIC_ENDPOINT_SCHEME:-https}
      PUBLIC_ENDPOINT_MODE: ${PUBLIC_ENDPOINT_MODE:-subdomain}
      PUBLIC_ENDPOINT_PREFIX: ${PUBLIC_ENDPOINT_PREFIX:-tx}
      INSTANCE_DATA_ROOT: /srv/ragenodes-staging-data
      MARIADB_HOST: mariadb
      DB_HOST: postgres-staging
      DB_USER: ${POSTGRES_USER}_staging
      DB_PASS: ${POSTGRES_PASSWORD}_staging
      DB_NAME: ${POSTGRES_DB}_staging
      DATABASE_URL: postgres://${POSTGRES_USER}_staging:${POSTGRES_PASSWORD}_staging@postgres-staging:5432/${POSTGRES_DB}_staging
      REDIS_URL: redis://redis-staging:6379
    networks:
      ragenodes_net_staging:
        aliases:
          - backend
    depends_on:
      postgres-staging:
        condition: service_healthy
      mariadb-staging:
        condition: service_started
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - /srv/ragenodes-staging-data:/srv/ragenodes-staging-data
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src:ro
      - ./fivem-base:/app/fivem-base
      - ./certs:/opt/ragenodes-ultimate/certs
    ports:
      - "127.0.0.1:3011:3006" # Puerto 3011 para el panel de Staging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    pids_limit: 256

  worker-docker-events-staging:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-1000}"
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      - RAGENODES_ROLE=worker-docker-events
      - CONTAINER_PREFIX=ragenodes-staging-
      - DOCKER_NETWORK=ragenodes_net_staging
      - PORT_BASE_OFFSET=${STAGING_PORT_BASE_OFFSET:-1000}
      - FIVEM_PUBLIC_HOST=${STAGING_GAME_PUBLIC_HOST:-node1.ragenodes.dev}
      - PUBLIC_ENDPOINT_HOST=${STAGING_PUBLIC_ENDPOINT_HOST:-ragenodes.dev}
      - PUBLIC_ENDPOINT_SCHEME=${PUBLIC_ENDPOINT_SCHEME:-https}
      - PUBLIC_ENDPOINT_MODE=${PUBLIC_ENDPOINT_MODE:-subdomain}
      - PUBLIC_ENDPOINT_PREFIX=${PUBLIC_ENDPOINT_PREFIX:-tx}
      - INSTANCE_DATA_ROOT=/srv/ragenodes-staging-data
      - DB_HOST=postgres-staging
      - DB_USER=${POSTGRES_USER}_staging
      - DB_PASS=${POSTGRES_PASSWORD}_staging
      - DB_NAME=${POSTGRES_DB}_staging
      - DATABASE_URL=postgres://${POSTGRES_USER}_staging:${POSTGRES_PASSWORD}_staging@postgres-staging:5432/${POSTGRES_DB}_staging
      - REDIS_URL=redis://redis-staging:6379
    command: ["node", "src/worker.js"]
    networks:
      - ragenodes_net_staging
    depends_on:
      backend-staging:
        condition: service_started
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - /srv/ragenodes-staging-data:/srv/ragenodes-staging-data
      - /srv/ragenodes-staging-data/templates:/srv/ragenodes-staging-data/templates:ro
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 128

  redis-staging:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    networks:
      - ragenodes_net_staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data_staging:/data

  oxide_control_panel:
    build:
      context: ./oxideproxy/node_panel
    image: ragenodes/oxide-control-panel:1.0.0-local
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      BACKEND_URL: http://backend-staging:3006
      CONFIG_PATH: /app/rust_config/oxide_proxy.yml
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    networks:
      - ragenodes_net_staging
    volumes:
      - ./oxideproxy/config:/app/rust_config
      - ./frontend/public/vendor:/app/public/vendor:ro
    depends_on:
      backend-staging:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  oxide_web_staging:
    build:
      context: ./oxideproxy
    image: ragenodes/oxideproxy:1.0.0-local
    restart: unless-stopped
    user: "65532:65532"
    networks:
      ragenodes_net_staging:
        aliases:
          - oxide_web
          - ragenodes-ultimate-oxide_web-1
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:80:80"
      - "${PROXY_BIND_IP:-127.0.0.1}:443:8443"
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${HOST_BIND_FRONTEND_PORT:-8088}:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./oxideproxy/config/oxide_proxy.yml:/app/config/oxide_proxy.yml:ro
      - oxide_acme_data_staging:/app/acme
      - oxide_runtime_data_staging:/app/runtime
      - ./frontend/public:/var/www/frontend:ro
      - /srv/ragenodes-staging-data:/var/www/frontend/data:ro
      - /srv/ragenodes-staging-data/templates:/var/www/frontend/data/templates:ro
    environment:
      - UPSTREAM_API=http://backend-staging:3006
      - STAGING_MODE=true
      - STAGING_DOMAINS=${STAGING_DOMAINS:-ragenodes.dev,panel.ragenodes.dev}
      - OXIDE_ACME_ENABLED=${OXIDE_ACME_ENABLED:-false}
      - OXIDE_ACME_DOMAINS=${OXIDE_ACME_DOMAINS:-}
      - OXIDE_ACME_EMAIL=${OXIDE_ACME_EMAIL:-}
      - OXIDE_ACME_PRODUCTION=${OXIDE_ACME_PRODUCTION:-false}
      - OXIDE_ACME_CACHE_DIR=/app/acme
      - OXIDE_DYNAMIC_WEB_DOMAINS=${OXIDE_DYNAMIC_WEB_DOMAINS:-ragenodes.dev,ragenodes.app,ragenodes.com,node1.ragenodes.com}
      - OXIDE_DYNAMIC_BACKEND_HOST=${OXIDE_DYNAMIC_BACKEND_HOST:-host.docker.internal}
      - OXIDE_TXADMIN_PORT_START=${OXIDE_TXADMIN_PORT_START:-40100}
      - OXIDE_TXADMIN_PORT_END=${OXIDE_TXADMIN_PORT_END:-59999}
      - OXIDE_BLENDER_PORT_START=${OXIDE_BLENDER_PORT_START:-50100}
      - OXIDE_BLENDER_PORT_END=${OXIDE_BLENDER_PORT_END:-59999}
      - OXIDE_FRAME_ANCESTORS=${OXIDE_FRAME_ANCESTORS:-https://ragenodes.com https://www.ragenodes.com https://panel.ragenodes.app https://ragenodes.dev https://panel.ragenodes.dev https://staging.ragenodes.com}
      - ACCESS_GATE_ENABLED=${ACCESS_GATE_ENABLED:-false}
      - ACCESS_GATE_DOMAIN=${ACCESS_GATE_DOMAIN:-}
      - ACCESS_GATE_SHARED_EDGE=${ACCESS_GATE_SHARED_EDGE:-false}
      - ACCESS_GATE_ALLOWED_EMAILS=${ACCESS_GATE_ALLOWED_EMAILS:-}
      - ACCESS_GATE_SESSION_SECRET=${ACCESS_GATE_SESSION_SECRET:-}
      - ACCESS_GATE_REDIS_URL=${ACCESS_GATE_REDIS_URL:-redis://redis-staging:6379/0}
      - ACCESS_GATE_FROM_EMAIL=${ACCESS_GATE_FROM_EMAIL:-RageNodes Access <info@ragenodes.com>}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - OXIDE_RUNTIME_BLACKLIST_PATH=/app/runtime/runtime-blacklist.txt
    depends_on:
      backend-staging:
        condition: service_started
      oxide_control_panel:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

networks:
  ragenodes_net_staging:
    name: ragenodes_net_staging

volumes:
  postgres_data_staging:
  mariadb_data_staging:
  redis_data_staging:
  oxide_acme_data_staging:
  oxide_runtime_data_staging:

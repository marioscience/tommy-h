<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 687" width="100%" height="100%">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="dotGrid" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12.5" cy="12.5" r="1" fill="rgba(255,255,255,0.12)" />
    </pattern>
  </defs>

  <!-- Background Tech Dot Matrix -->
  <rect width="1000" height="687" fill="url(#dotGrid)" />

  <!-- Latitude / Longitude HUD Lines -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1">
    <line x1="0" y1="171" x2="1000" y2="171" stroke-dasharray="4,4" />
    <line x1="0" y1="343" x2="1000" y2="343" stroke-dasharray="4,4" />
    <line x1="0" y1="515" x2="1000" y2="515" stroke-dasharray="4,4" />
    <line x1="250" y1="0" x2="250" y2="687" stroke-dasharray="4,4" />
    <line x1="500" y1="0" x2="500" y2="687" stroke-dasharray="4,4" />
    <line x1="750" y1="0" x2="750" y2="687" stroke-dasharray="4,4" />
  </g>

  <!-- Crisp, Highly Detailed Vector HUD Continents -->
  <g fill="url(#techGrad)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" filter="url(#subtleGlow)" stroke-linejoin="round" stroke-linecap="round">
    
    <!-- North America & Central America -->
    <path d="M50,150 L120,130 L180,120 L220,150 L250,130 L290,160 L310,210 L280,250 L260,300 L245,340 L240,385 L215,380 L210,345 L180,345 L160,330 L145,365 L165,415 L190,440 L210,450 L180,430 L150,400 L120,360 L100,320 L110,355 L90,310 L80,270 L70,210 L60,180 L30,160 L50,150 Z" />
    
    <!-- Greenland -->
    <path d="M280,100 L350,80 L390,100 L370,150 L330,180 L290,160 L270,120 Z" />

    <!-- Caribbean Islands -->
    <path d="M230,400 L260,405 L250,415 L220,410 Z" />
    <path d="M270,410 L290,415 L285,425 L265,420 Z" />

    <!-- South America -->
    <path d="M210,450 L260,450 L310,470 L350,490 L340,530 L320,570 L280,620 L260,660 L250,660 L240,610 L230,530 L210,480 L210,450 Z" />

    <!-- Europe -->
    <path d="M420,310 L445,325 L465,305 L465,280 L480,290 L505,330 L495,330 L480,300 L510,300 L530,325 L540,310 L560,290 L580,250 L600,200 L560,150 L520,150 L500,180 L470,190 L480,220 L510,210 L530,170 L520,150 L480,160 L460,200 L480,240 L510,265 L470,255 L450,265 L435,275 L430,290 L420,310 Z" />

    <!-- UK & Ireland -->
    <path d="M445,235 L465,215 L475,235 L475,250 L460,255 L450,250 L445,235 Z" />
    <path d="M435,235 L445,230 L445,245 L435,245 Z" />

    <!-- Africa -->
    <path d="M420,325 L380,390 L375,410 L410,425 L440,425 L460,435 L480,450 L500,530 L510,580 L530,620 L550,610 L570,550 L580,500 L620,440 L600,420 L570,380 L550,340 L520,330 L470,330 L420,325 Z" />

    <!-- Madagascar -->
    <path d="M590,510 L610,495 L620,530 L605,560 L590,540 Z" />

    <!-- Asia -->
    <path d="M550,320 L570,350 L590,390 L620,400 L630,370 L610,350 L640,350 L670,370 L680,380 L700,435 L720,380 L740,380 L750,410 L760,420 L775,455 L785,455 L770,420 L780,400 L800,370 L830,350 L860,320 L850,290 L870,280 L885,305 L875,310 L860,280 L890,250 L940,200 L950,230 L920,250 L900,250 L850,210 L800,180 L700,160 L600,160 L560,200 L580,250 L560,290 L550,320 Z" />

    <!-- Japan -->
    <path d="M890,280 L915,265 L925,290 L905,325 L895,320 L905,290 Z" />

    <!-- Taiwan & Philippines -->
    <path d="M845,355 L855,350 L850,365 Z" />
    <path d="M835,390 L855,385 L860,420 L840,430 Z" />

    <!-- Indonesia (Sumatra, Java, Borneo, Sulawesi, Papua) -->
    <path d="M765,455 L795,485 L785,495 L755,465 Z" />
    <path d="M795,500 L840,510 L835,520 L790,510 Z" />
    <path d="M800,455 L830,455 L830,485 L805,485 Z" />
    <path d="M840,465 L855,460 L855,490 L840,485 Z" />
    <path d="M870,480 L920,490 L910,510 L865,500 Z" />

    <!-- Australia & New Zealand -->
    <path d="M810,530 L840,520 L860,515 L880,530 L910,540 L930,580 L920,620 L900,630 L880,630 L850,600 L830,610 L810,590 L810,530 Z" />
    <path d="M885,645 L900,645 L895,660 L880,655 Z" />
    <path d="M960,620 L980,645 L970,665 L950,650 Z" />

  </g>

  <!-- HUD Target Beacons at Exact Node Locations -->
  <g fill="none" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5">
    <!-- Madrid (450, 309) -->
    <circle cx="450" cy="309" r="16" stroke-dasharray="3,3" />
    <circle cx="450" cy="309" r="8" opacity="0.5" />
    <!-- Frankfurt (510, 261) -->
    <circle cx="510" cy="261" r="16" stroke-dasharray="3,3" />
    <circle cx="510" cy="261" r="8" opacity="0.5" />
    <!-- London (470, 240) -->
    <circle cx="470" cy="240" r="16" stroke-dasharray="3,3" />
    <circle cx="470" cy="240" r="8" opacity="0.5" />
    <!-- Miami (220, 377) -->
    <circle cx="220" cy="377" r="16" stroke-dasharray="3,3" />
    <circle cx="220" cy="377" r="8" opacity="0.5" />
    <!-- Singapore (820, 446) -->
    <circle cx="820" cy="446" r="16" stroke-dasharray="3,3" />
    <circle cx="820" cy="446" r="8" opacity="0.5" />
  </g>
</svg>

<template class="game-module-rcon">
    <div id="rcon-panel-discordbot" class="hidden">
        <div style="background: rgba(15, 15, 18, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 30px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">
                <div style="display: flex; justify-content: center; align-items: center; width: 45px; height: 45px; border-radius: 12px; background: rgba(88, 101, 242, 0.1); border: 1px solid rgba(88, 101, 242, 0.2);">
                    <i class="fa-brands fa-discord" style="font-size: 1.2rem; color: #5865f2;"></i>
                </div>
                <div style="flex-grow:1;">
                    <h4 style="margin: 0; color: white; font-weight: 800; font-size: 1.2rem;">Panel de Control del Bot</h4>
                    <span style="color: #94a3b8; font-size: 0.9rem;">Instala dependencias y edita variables de entorno</span>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
                <!-- Dependencias -->
                <div>
                    <h5 style="color:white; margin-bottom:15px; font-size:1.05rem;"><i class="fa-solid fa-box-open" style="color:#38bdf8; margin-right:5px;"></i> Gestor de Paquetes</h5>
                    <p class="muted" style="font-size:0.85rem; margin-bottom:15px;">Instala automáticamente los paquetes necesarios para que tu bot funcione. <strong style="color:#fbbf24;">(Requiere que el bot esté encendido)</strong></p>
                    
                    <div style="display:flex; flex-direction:column; gap:10px;">
                        <button class="btn" data-rn-onclick="priv_0167" style="background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; text-align: left; transition: all 0.3s;" data-rn-onmouseover="priv_0168" data-rn-onmouseout="priv_0169">
                            <i class="fa-brands fa-npm" style="width: 25px; font-size: 1.2rem;"></i> <strong>Instalar con NPM</strong> <span style="font-size:0.8rem; color:#94a3b8; margin-left:5px;">(Node.js / package.json)</span>
                        </button>
                        <button class="btn" data-rn-onclick="priv_0170" style="background: rgba(56, 189, 248, 0.1); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); padding: 12px; text-align: left; transition: all 0.3s;" data-rn-onmouseover="priv_0171" data-rn-onmouseout="priv_0172">
                            <i class="fa-brands fa-python" style="width: 25px; font-size: 1.2rem;"></i> <strong>Instalar con PIP</strong> <span style="font-size:0.8rem; color:#94a3b8; margin-left:5px;">(Python / requirements.txt)</span>
                        </button>
                    </div>
                </div>

                <!-- Editor de Variables -->
                <div>
                    <h5 style="color:white; margin-bottom:15px; font-size:1.05rem;"><i class="fa-solid fa-key" style="color:#22c55e; margin-right:5px;"></i> Archivo de Entorno</h5>
                    <p class="muted" style="font-size:0.85rem; margin-bottom:15px;">Edita rápidamente el archivo <code>.env</code> o <code>config.json</code> principal de tu bot.</p>
                    
                    <div style="display:flex; gap:10px; margin-bottom:10px;">
                        <input type="text" id="discord-env-filename" class="input" style="background:rgba(0,0,0,0.4); flex-grow:1;" value=".env">
                        <button class="btn" style="background:rgba(255,255,255,0.1); color:white;" data-rn-onclick="priv_0173"><i class="fa-solid fa-folder-open"></i> Abrir</button>
                    </div>
                    
                    <textarea id="discord-env-content" class="input" style="width:100%; height:150px; background:rgba(0,0,0,0.6); font-family:monospace; font-size:0.85rem;" placeholder="Aquí aparecerá el contenido de tu archivo..."></textarea>
                    
                    <button class="btn btn-primary" style="width:100%; margin-top:10px;" data-rn-onclick="priv_0174"><i class="fa-solid fa-save"></i> Guardar Archivo</button>
                </div>
            </div>

        </div>
    </div>
    <script>
        async function executeAutoInstall(type) {
            if(confirm(`¿Estás seguro de que quieres ejecutar la instalación de dependencias con ${type.toUpperCase()}? Este proceso puede tardar unos segundos.`)) {
                showToast(`Iniciando instalación de dependencias con ${type.toUpperCase()}...`, 'info');
                try {
                    const res = await Nexus.api(`/api/servers/${currentServerId}/auto-install`, { method: 'POST', body: JSON.stringify({ type }) });
                    if(res.error) throw new Error(res.error);
                    showToast(res.message, 'success');
                } catch(e) {
                    showToast(e.message, 'error');
                }
            }
        }

        async function loadDiscordEnvFile() {
            const filename = document.getElementById('discord-env-filename').value;
            if(!filename) return showToast('Escribe un nombre de archivo válido.', 'error');
            try {
                const res = await Nexus.api(`/api/files/read?serverId=${currentServerId}&path=${encodeURIComponent(filename)}`);
                if(res.error) throw new Error(res.error);
                document.getElementById('discord-env-content').value = res.content || '';
                showToast(`Archivo ${filename} cargado.`, 'success');
            } catch(e) {
                showToast('No se encontró el archivo. Si es nuevo, guárdalo para crearlo.', 'warning');
                document.getElementById('discord-env-content').value = '';
            }
        }

        async function saveDiscordEnvFile() {
            const filename = document.getElementById('discord-env-filename').value;
            const content = document.getElementById('discord-env-content').value;
            if(!filename) return showToast('Escribe un nombre de archivo válido.', 'error');
            try {
                const res = await Nexus.api('/api/files/write', {
                    method: 'PUT',
                    body: JSON.stringify({
                        serverId: currentServerId,
                        path: filename,
                        content: content
                    })
                });
                if(res.error) throw new Error(res.error);
                showToast('Archivo guardado exitosamente.', 'success');
            } catch(e) {
                showToast(e.message, 'error');
            }
        }
        
        setTimeout(() => { if(currentServer && currentServer.template === 'discordbot') loadDiscordEnvFile(); }, 1000);
    </script>
</template>

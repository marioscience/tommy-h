<template class="game-module-rcon">
    <div id="rcon-panel-ark" class="hidden">
        <div class="ark-panel-card">
            <div class="ark-section-header">
                <div class="ark-icon-box">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <div class="ark-section-title">
                    <h4>Multiplicadores de Juego</h4>
                    <span>Configura las tasas de Taming, Farmeo y XP</span>
                </div>
                <button class="btn btn-primary" data-rn-onclick="priv_0158"><i class="fa-solid fa-save"></i> Guardar</button>
            </div>

            <div class="ark-multipliers-grid">
                <div class="ark-multiplier-card">
                    <label class="form-label">
                        <span><i class="fa-solid fa-paw ark-icon-taming"></i> Taming Speed</span>
                        <span id="ark-val-taming" class="ark-val ark-val-taming">x5.0</span>
                    </label>
                    <input type="range" id="ark-taming" min="0.1" max="100" step="0.1" value="5.0" data-rn-oninput="priv_0159">
                </div>

                <div class="ark-multiplier-card">
                    <label class="form-label">
                        <span><i class="fa-solid fa-tree ark-icon-harvest"></i> Harvest Amount</span>
                        <span id="ark-val-harvest" class="ark-val ark-val-harvest">x5.0</span>
                    </label>
                    <input type="range" id="ark-harvest" min="0.1" max="100" step="0.1" value="5.0" data-rn-oninput="priv_0160">
                </div>

                <div class="ark-multiplier-card">
                    <label class="form-label">
                        <span><i class="fa-solid fa-arrow-up-right-dots ark-icon-xp"></i> XP Multiplier</span>
                        <span id="ark-val-xp" class="ark-val ark-val-xp">x1.0</span>
                    </label>
                    <input type="range" id="ark-xp" min="0.1" max="100" step="0.1" value="1.0" data-rn-oninput="priv_0161">
                </div>
            </div>

            <div class="ark-identity-grid">
                <div class="ark-form-field">
                    <label class="form-label">Nombre del Servidor</label>
                    <input type="text" id="ark-sessionname" class="input" autocomplete="off">
                </div>
                <div class="ark-form-field">
                    <label class="form-label">Contraseña de Admin</label>
                    <input type="password" id="ark-adminpass" class="input" autocomplete="current-password">
                </div>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="ark.css">
    <script>
        (function() {
            if (window.__arkScriptLoaded) return;
            window.__arkScriptLoaded = true;
            const s = document.createElement('script');
            s.src = 'ark.js';
            document.head.appendChild(s);
        })();
    </script>
</template>

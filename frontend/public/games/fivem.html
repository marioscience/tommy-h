<template class="game-module-rcon">
    <div id="rcon-panel-fivem" class="hidden">
        <div style="background: rgba(15, 15, 18, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 40px 30px; text-align: center; margin-top: 20px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="position: absolute; top: -50px; left: 50%; transform: translateX(-50%); width: 200px; height: 100px; background: var(--primary); filter: blur(80px); opacity: 0.15; border-radius: 50%;"></div>
            <div style="display: inline-flex; justify-content: center; align-items: center; width: 80px; height: 80px; border-radius: 50%; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2); margin-bottom: 20px; box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);">
                <i class="fa-solid fa-shield-halved" style="font-size: 32px; color: var(--primary); text-shadow: 0 0 15px var(--primary);"></i>
            </div>
            <h3 style="color: white; font-size: 1.5rem; font-weight: 800; margin-bottom: 15px; letter-spacing: -0.5px;">Administración Avanzada</h3>
            <p style="color: #94a3b8; font-size: 1.05rem; max-width: 500px; margin: 0 auto 30px; line-height: 1.6;">
                La gestión de jugadores, comandos y reportes para servidores de <strong style="color:white;">FiveM</strong> se administra de forma nativa a través del panel premium de <strong style="color:white;">txAdmin</strong>.
            </p>
            <button class="btn" data-rn-onclick="priv_0175" style="background: var(--primary); color: white; border: none; font-size: 1.05rem; font-weight: 600; padding: 12px 30px; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 20px rgba(99,102,241,0.4);" data-rn-onmouseover="priv_0176" data-rn-onmouseout="priv_0177">
                <i class="fa-solid fa-arrow-up-right-from-square" style="margin-right: 8px;"></i> Abrir txAdmin
            </button>

            <!-- Resource Control -->
            <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); text-align: left;">
                <h4 style="color: white; font-size: 1.1rem; margin-bottom: 15px;"><i class="fa-solid fa-boxes-stacked" style="color: #6366f1; margin-right: 8px;"></i> Control de Recursos en Vivo</h4>
                <p class="muted" style="font-size: 0.9rem; margin-bottom: 15px;">Inicia, detiene o reinicia recursos sin necesidad de abrir la consola ni txAdmin. <strong style="color: #fbbf24;">(El servidor debe estar encendido)</strong></p>
                
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <input type="text" id="fivem-resource-name" class="input" style="background: rgba(0,0,0,0.4); flex-grow: 1; min-width: 200px;" placeholder="Ej. qb-core">
                    
                    <button class="btn btn-success" data-rn-onclick="priv_0178" style="padding: 10px 20px;">
                        <i class="fa-solid fa-play"></i> Start
                    </button>
                    <button class="btn btn-danger" data-rn-onclick="priv_0179" style="padding: 10px 20px;">
                        <i class="fa-solid fa-stop"></i> Stop
                    </button>
                    <button class="btn btn-warning" data-rn-onclick="priv_0180" style="padding: 10px 20px; color: black;">
                        <i class="fa-solid fa-rotate-right"></i> Restart
                    </button>
                    <button class="btn btn-info" data-rn-onclick="priv_0181" style="padding: 10px 20px; color: black;">
                        <i class="fa-solid fa-check-double"></i> Ensure
                    </button>
                </div>
            </div>

            <script>
                async function executeFiveMResource(action) {
                    const resourceName = document.getElementById('fivem-resource-name').value.trim();
                    if (!resourceName) return showToast('Escribe el nombre del recurso.', 'error');
                    
                    const command = `${action} ${resourceName}`;
                    try {
                        const res = await Nexus.api(`/api/servers/${currentServerId}/command`, { method: 'POST', body: JSON.stringify({ command }) });
                        if (res.error) throw new Error(res.error);
                        showToast(`Comando '${command}' enviado al servidor.`, 'success');
                    } catch (e) {
                        showToast(e.message, 'error');
                    }
                }
            </script>

        </div>
    </div>
</template>

<template class="game-module-rcon">
    <div id="rcon-panel-palworld" class="hidden">
        <div style="background: rgba(15, 15, 18, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 30px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">
                <div style="display: flex; justify-content: center; align-items: center; width: 45px; height: 45px; border-radius: 12px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2);">
                    <i class="fa-solid fa-paw" style="font-size: 1.2rem; color: #38bdf8;"></i>
                </div>
                <div style="flex-grow:1;">
                    <h4 style="margin: 0; color: white; font-weight: 800; font-size: 1.2rem;">Multiplicadores & Config</h4>
                    <span style="color: #94a3b8; font-size: 0.9rem;">Configura las reglas del mundo de Palworld</span>
                </div>
                <button class="btn btn-primary" data-rn-onclick="priv_0197"><i class="fa-solid fa-save"></i> Guardar</button>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-bottom: 30px;">
                <!-- ExpRate -->
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <label class="form-label" style="color:white; margin-bottom:10px; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-arrow-up-right-dots" style="color:#38bdf8; margin-right:5px;"></i> Exp Rate</span>
                        <span id="pal-val-exp" style="color:#38bdf8; font-weight:bold;">x1.0</span>
                    </label>
                    <input type="range" id="pal-exp" min="0.1" max="20" step="0.1" value="1.0" style="width:100%; accent-color:#38bdf8;" data-rn-oninput="priv_0198">
                </div>

                <!-- Capture Rate -->
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <label class="form-label" style="color:white; margin-bottom:10px; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-bullseye" style="color:#22c55e; margin-right:5px;"></i> Catch Rate</span>
                        <span id="pal-val-catch" style="color:#22c55e; font-weight:bold;">x1.0</span>
                    </label>
                    <input type="range" id="pal-catch" min="0.1" max="10" step="0.1" value="1.0" style="width:100%; accent-color:#22c55e;" data-rn-oninput="priv_0199">
                </div>

                <!-- Death Penalty -->
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <label class="form-label" style="color:white; margin-bottom:10px; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-skull" style="color:#ef4444; margin-right:5px;"></i> Death Penalty</span>
                    </label>
                    <select id="pal-death" class="input" style="width:100%; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1);">
                        <option value="All">Perder Todo (Items y Pals)</option>
                        <option value="Item">Solo perder Items</option>
                        <option value="ItemAndEquipment">Perder Items y Equipamiento</option>
                        <option value="None">Sin Penalización (Conservar todo)</option>
                    </select>
                </div>
            </div>

            <!-- Broadcast System -->
            <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); text-align: left;">
                <h4 style="color: white; font-size: 1.1rem; margin-bottom: 15px;"><i class="fa-solid fa-bullhorn" style="color: #fbbf24; margin-right: 8px;"></i> Broadcast Global</h4>
                <p class="muted" style="font-size: 0.9rem; margin-bottom: 15px;">Envía un mensaje a todos los jugadores online en este momento. <strong style="color: #fbbf24;">(El servidor debe estar encendido)</strong></p>
                
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <input type="text" id="palworld-broadcast-msg" class="input" style="background: rgba(0,0,0,0.4); flex-grow: 1; min-width: 200px;" placeholder="Ej. El servidor se reiniciará en 5 minutos.">
                    
                    <button class="btn btn-warning" data-rn-onclick="priv_0200" style="padding: 10px 20px; color: black;">
                        <i class="fa-solid fa-paper-plane"></i> Enviar Mensaje
                    </button>
                </div>
            </div>

        </div>
    </div>
    <script>
        async function loadPalworldSettings() {
            try {
                const config = await Nexus.api(`/api/palworld/config/${currentServerId}`);
                if(config.error) return;
                
                if (config['ExpRate']) {
                    document.getElementById('pal-exp').value = parseFloat(config['ExpRate']);
                    document.getElementById('pal-val-exp').innerText = 'x' + parseFloat(config['ExpRate']);
                }
                if (config['PalCaptureRate']) {
                    document.getElementById('pal-catch').value = parseFloat(config['PalCaptureRate']);
                    document.getElementById('pal-val-catch').innerText = 'x' + parseFloat(config['PalCaptureRate']);
                }
                if (config['DeathPenalty']) {
                    document.getElementById('pal-death').value = config['DeathPenalty'];
                }
            } catch(e) {}
        }

        async function savePalworldSettings() {
            const body = {
                'ExpRate': parseFloat(document.getElementById('pal-exp').value).toFixed(6),
                'PalCaptureRate': parseFloat(document.getElementById('pal-catch').value).toFixed(6),
                'DeathPenalty': document.getElementById('pal-death').value
            };

            try {
                const res = await Nexus.api(`/api/palworld/config/${currentServerId}`, { method: 'POST', body: JSON.stringify(body) });
                if(res.error) throw new Error(res.error);
                showToast('Configuración guardada (Reinicio requerido)', 'success');
            } catch(e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        async function executePalworldBroadcast() {
            let msg = document.getElementById('palworld-broadcast-msg').value.trim();
            if (!msg) return showToast('Escribe un mensaje.', 'error');
            
            // Reemplazar espacios por _ (Palworld no admite espacios por RCON)
            msg = msg.replace(/ /g, '_');
            const command = `Broadcast ${msg}`;
            
            try {
                const res = await Nexus.api(`/api/servers/${currentServerId}/command`, { method: 'POST', body: JSON.stringify({ command }) });
                if (res.error) throw new Error(res.error);
                showToast(`Mensaje enviado.`, 'success');
                document.getElementById('palworld-broadcast-msg').value = '';
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        setTimeout(() => { if(currentServer && currentServer.template === 'palworld') loadPalworldSettings(); }, 1000);
    </script>
</template>

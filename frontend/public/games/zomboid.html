<template class="game-module-rcon">
    <div id="rcon-panel-zomboid" class="hidden">
        <div style="background: rgba(15, 15, 18, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 30px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">
                <div style="display: flex; justify-content: center; align-items: center; width: 45px; height: 45px; border-radius: 12px; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.2);">
                    <i class="fa-solid fa-biohazard" style="font-size: 1.2rem; color: #a855f7;"></i>
                </div>
                <div style="flex-grow:1;">
                    <h4 style="margin: 0; color: white; font-weight: 800; font-size: 1.2rem;">Gestor de Mods & Config</h4>
                    <span style="color: #94a3b8; font-size: 0.9rem;">Instalador de Steam Workshop y Variables del Mundo</span>
                </div>
                <button class="btn btn-primary" data-rn-onclick="priv_0218"><i class="fa-solid fa-save"></i> Guardar</button>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px;">
                <!-- Mod Manager -->
                <div>
                    <h5 style="color:white; margin-bottom:15px; font-size:1.05rem;"><i class="fa-brands fa-steam" style="color:#38bdf8; margin-right:5px;"></i> Steam Workshop</h5>
                    
                    <label class="form-label" style="color:white; margin-bottom:5px; display:block; font-size:0.85rem;">Workshop IDs (Separados por punto y coma `;`)</label>
                    <textarea id="zomboid-workshop" class="input" style="width:100%; background:rgba(0,0,0,0.4); min-height:80px; margin-bottom:15px;" placeholder="Ej. 2818323120;2925344840"></textarea>

                    <label class="form-label" style="color:white; margin-bottom:5px; display:block; font-size:0.85rem;">Mod IDs (Separados por punto y coma `;`)</label>
                    <textarea id="zomboid-mods" class="input" style="width:100%; background:rgba(0,0,0,0.4); min-height:80px;" placeholder="Ej. mod_name1;mod_name2"></textarea>
                    
                    <p class="muted" style="font-size:0.75rem; margin-top:10px;"><i class="fa-solid fa-circle-info text-info"></i> Ambos campos son requeridos por Project Zomboid para descargar y cargar los mods correctamente.</p>
                </div>

                <!-- Server Settings -->
                <div>
                    <h5 style="color:white; margin-bottom:15px; font-size:1.05rem;"><i class="fa-solid fa-sliders" style="color:#22c55e; margin-right:5px;"></i> Server Settings</h5>
                    
                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <div>
                            <label class="form-label" style="color:white; margin-bottom:5px; display:block; font-size:0.85rem;">Public Name</label>
                            <input type="text" id="zomboid-name" class="input" style="width:100%; background:rgba(0,0,0,0.4);">
                        </div>
                        <div>
                            <label class="form-label" style="color:white; margin-bottom:5px; display:block; font-size:0.85rem;">Password (Contraseña para entrar)</label>
                            <input type="text" id="zomboid-password" class="input" style="width:100%; background:rgba(0,0,0,0.4);">
                        </div>
                        <div style="display:flex; gap:15px;">
                            <div style="flex:1;">
                                <label class="form-label" style="color:white; margin-bottom:5px; display:block; font-size:0.85rem;">Max Players</label>
                                <input type="number" id="zomboid-maxplayers" class="input" style="width:100%; background:rgba(0,0,0,0.4);">
                            </div>
                            <div style="flex:1;">
                                <label class="form-label" style="color:white; margin-bottom:5px; display:block; font-size:0.85rem;">PVP</label>
                                <select id="zomboid-pvp" class="input" style="width:100%; background:rgba(0,0,0,0.4);">
                                    <option value="true">Activado</option>
                                    <option value="false">Desactivado</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script>
        async function loadZomboidSettings() {
            try {
                const config = await Nexus.api(`/api/zomboid/config/${currentServerId}`);
                if(config.error) return;
                
                document.getElementById('zomboid-workshop').value = config['WorkshopItems'] || '';
                document.getElementById('zomboid-mods').value = config['Mods'] || '';
                
                document.getElementById('zomboid-name').value = config['PublicName'] || '';
                document.getElementById('zomboid-password').value = config['Password'] || '';
                document.getElementById('zomboid-maxplayers').value = config['MaxPlayers'] || '32';
                document.getElementById('zomboid-pvp').value = config['PVP'] || 'false';
            } catch(e) {}
        }

        async function saveZomboidSettings() {
            const body = {
                'WorkshopItems': document.getElementById('zomboid-workshop').value.trim(),
                'Mods': document.getElementById('zomboid-mods').value.trim(),
                'PublicName': document.getElementById('zomboid-name').value.trim(),
                'Password': document.getElementById('zomboid-password').value.trim(),
                'MaxPlayers': document.getElementById('zomboid-maxplayers').value,
                'PVP': document.getElementById('zomboid-pvp').value
            };

            try {
                const res = await Nexus.api(`/api/zomboid/config/${currentServerId}`, { method: 'POST', body: JSON.stringify(body) });
                if(res.error) throw new Error(res.error);
                showToast('Configuración guardada (Reinicio requerido para descargar mods)', 'success');
            } catch(e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        setTimeout(() => { if(currentServer && currentServer.template === 'zomboid') loadZomboidSettings(); }, 1000);
    </script>
</template>

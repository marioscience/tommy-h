<template class="game-module-rcon">
    <div id="rcon-panel-ark" class="hidden">
        <div style="background: rgba(15, 15, 18, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 30px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">
                <div style="display: flex; justify-content: center; align-items: center; width: 45px; height: 45px; border-radius: 12px; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2);">
                    <i class="fa-solid fa-leaf" style="font-size: 1.2rem; color: #22c55e;"></i>
                </div>
                <div style="flex-grow:1;">
                    <h4 style="margin: 0; color: white; font-weight: 800; font-size: 1.2rem;">Multiplicadores de Juego</h4>
                    <span style="color: #94a3b8; font-size: 0.9rem;">Configura las tasas de Taming, Farmeo y XP</span>
                </div>
                <button class="btn btn-primary" data-rn-onclick="priv_0158"><i class="fa-solid fa-save"></i> Guardar</button>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; margin-bottom: 30px;">
                <!-- Taming -->
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <label class="form-label" style="color:white; margin-bottom:10px; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-paw" style="color:#fbbf24; margin-right:5px;"></i> Taming Speed</span>
                        <span id="ark-val-taming" style="color:#fbbf24; font-weight:bold;">x5.0</span>
                    </label>
                    <input type="range" id="ark-taming" min="0.1" max="100" step="0.1" value="5.0" style="width:100%; accent-color:#fbbf24;" data-rn-oninput="priv_0159">
                </div>

                <!-- Harvest -->
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <label class="form-label" style="color:white; margin-bottom:10px; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-tree" style="color:#22c55e; margin-right:5px;"></i> Harvest Amount</span>
                        <span id="ark-val-harvest" style="color:#22c55e; font-weight:bold;">x5.0</span>
                    </label>
                    <input type="range" id="ark-harvest" min="0.1" max="100" step="0.1" value="5.0" style="width:100%; accent-color:#22c55e;" data-rn-oninput="priv_0160">
                </div>

                <!-- XP -->
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                    <label class="form-label" style="color:white; margin-bottom:10px; display:flex; justify-content:space-between;">
                        <span><i class="fa-solid fa-arrow-up-right-dots" style="color:#38bdf8; margin-right:5px;"></i> XP Multiplier</span>
                        <span id="ark-val-xp" style="color:#38bdf8; font-weight:bold;">x1.0</span>
                    </label>
                    <input type="range" id="ark-xp" min="0.1" max="100" step="0.1" value="1.0" style="width:100%; accent-color:#38bdf8;" data-rn-oninput="priv_0161">
                </div>
            </div>

            <!-- Identidad básica -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div>
                    <label class="form-label" style="color:white; margin-bottom:5px; display:block;">Nombre del Servidor</label>
                    <input type="text" id="ark-sessionname" class="input" style="width:100%; background:rgba(0,0,0,0.4);">
                </div>
                <div>
                    <label class="form-label" style="color:white; margin-bottom:5px; display:block;">Contraseña de Admin</label>
                    <input type="text" id="ark-adminpass" class="input" style="width:100%; background:rgba(0,0,0,0.4);">
                </div>
            </div>

        </div>
    </div>
    <script>
        async function loadArkSettings() {
            try {
                const config = await Nexus.api(`/api/ark/config/${currentServerId}`);
                if(config.error) return;
                
                if (config['TamingSpeedMultiplier']) {
                    document.getElementById('ark-taming').value = config['TamingSpeedMultiplier'];
                    document.getElementById('ark-val-taming').innerText = 'x' + config['TamingSpeedMultiplier'];
                }
                if (config['HarvestAmountMultiplier']) {
                    document.getElementById('ark-harvest').value = config['HarvestAmountMultiplier'];
                    document.getElementById('ark-val-harvest').innerText = 'x' + config['HarvestAmountMultiplier'];
                }
                // Utilizamos el general
                if (config['GenericXPMultiplier']) {
                    document.getElementById('ark-xp').value = config['GenericXPMultiplier'];
                    document.getElementById('ark-val-xp').innerText = 'x' + config['GenericXPMultiplier'];
                }

                document.getElementById('ark-sessionname').value = config['SessionName'] || '';
                document.getElementById('ark-adminpass').value = config['ServerAdminPassword'] || '';
            } catch(e) {}
        }

        async function saveArkSettings() {
            const body = {
                'TamingSpeedMultiplier': document.getElementById('ark-taming').value,
                'HarvestAmountMultiplier': document.getElementById('ark-harvest').value,
                'GenericXPMultiplier': document.getElementById('ark-xp').value,
                'KillXPMultiplier': document.getElementById('ark-xp').value,
                'HarvestXPMultiplier': document.getElementById('ark-xp').value,
                'CraftXPMultiplier': document.getElementById('ark-xp').value,
                'SessionName': document.getElementById('ark-sessionname').value,
                'ServerAdminPassword': document.getElementById('ark-adminpass').value,
            };

            try {
                const res = await Nexus.api(`/api/ark/config/${currentServerId}`, { method: 'POST', body: JSON.stringify(body) });
                if(res.error) throw new Error(res.error);
                showToast('Configuración de ARK guardada (Reinicia el servidor para aplicar)', 'success');
            } catch(e) {
                showToast('Error: ' + e.message, 'error');
            }
        }

        setTimeout(() => { if(currentServer && currentServer.template === 'ark') loadArkSettings(); }, 1000);
    </script>
</template>

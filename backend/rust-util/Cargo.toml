[package]
name = "ragenodes-util"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
zip = "2.2.0"
walkdir = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.14"
tar = "0.4"
flate2 = "1.0"
rayon = "1.10"
zstd = { version = "0.13", features = ["zstdmt"] }
jwalk = "0.8"
anyhow = "1.0"
sha2 = "0.10"
itoa = "1.0"
ryu = "1.0"
bollard = "0.15"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
napi = { version = "2", default-features = false, features = ["async", "napi4", "tokio_rt", "napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

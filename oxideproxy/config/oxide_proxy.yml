ingress:
  tcp_listen_addr: 0.0.0.0:8443
  udp_listen_addr: 0.0.0.0:8080
  max_concurrent_connections: 1000000
  initial_buffer_size: 4096
routing:
  default_web_backend: 10.5.0.12:80
  game_servers:
  - game_id: 1001
    backend_addr: 10.5.0.10:9001
    description: Mock MMORPG Realm (Python UDP en 10.5.0.10)
    port_range: '9001'
    name: Mock MMORPG Realm
    protocol: UDP
  - game_id: 1002
    backend_addr: 10.5.0.11:9002
    description: Mock FPS Arena (Python UDP en 10.5.0.11)
    port_range: '9002'
    name: Mock FPS Arena
    protocol: UDP
tls:
  cert_path: config/certs/cert.pem
  key_path: config/certs/key.pem
runtime:
  worker_threads: null
  enable_core_pinning: false
advanced_tuning:
  ebpf_xdp:
    enabled: true
    interface: eth0
    ddos_mitigation_mode: STRICT_GAMING
    max_packet_rate_per_ip: 25000
  tcp_settings:
    tcp_nodelay: true
    keepalive_interval_secs: 30
    congestion_control: bbr
  security:
    rate_limit_conns_per_ip: 150
    blacklist_enabled: true
    handshake_timeout_ms: 1500
    blacklisted_ips: []

# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection
variables:
  SECRET_DETECTION_ENABLED: 'true'
  AST_ENABLE_MR_PIPELINES: 'true'

security_contracts:
  stage: test
  image: node:24-bookworm
  cache:
    key: "${CI_COMMIT_REF_SLUG}-npm"
    paths:
    - .npm-cache/
  before_script:
  - npm ci --ignore-scripts --cache .npm-cache
  script:
  - npm run security:secrets
  - npm run security:csp-bindings
  - npm run security:inline-code
  - npm run security:deployment

backend_tests:
  stage: test
  image: node:24-bookworm
  cache:
    key: "${CI_COMMIT_REF_SLUG}-backend-npm"
    paths:
    - backend/.npm-cache/
  before_script:
  - cd backend
  - npm ci --ignore-scripts --cache .npm-cache
  script:
  - npm test

dependency_audit:
  stage: test
  image: node:24-bookworm
  before_script:
  - npm ci --ignore-scripts --cache .npm-cache
  - cd backend && npm ci --ignore-scripts --cache .npm-cache && cd ..
  script:
  - npm audit --omit=dev --audit-level=high
  - cd backend && npm audit --omit=dev --audit-level=high

oxide_tests:
  stage: test
  image: rust:bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
  cache:
    key: "${CI_COMMIT_REF_SLUG}-cargo"
    paths:
    - .cargo/
    - oxideproxy/target/
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  script:
  - cargo test --manifest-path oxideproxy/Cargo.toml --locked

compose_validation:
  stage: test
  image: docker:27.5.1-cli
  before_script:
  - cp .env.example .env
  - export LEGO_EMAIL=ci@example.invalid
  script:
  - docker compose -f docker-compose.yml config --quiet
  - docker compose -f docker-compose.staging.yml config --quiet
  - docker compose -f docker-compose.yml -f docker-compose.security.yml config --quiet
  - docker compose -f docker-compose.yml -f docker-compose.backup-remote.yml config --quiet
  - docker compose -f docker-compose.yml -f docker-compose.powerdns.yml --profile dns-authority --profile dns-certificate config --quiet

secret_detection:
  stage: secret-detection
include:
- template: Security/Secret-Detection.gitlab-ci.yml
- template: Jobs/SAST.gitlab-ci.yml
- template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    env_file: [ .env ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ragenodes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpu_shares: 1024

  mariadb:
    image: mariadb@sha256:de61fed4a40d3842f3ee09944ba52792156cfd9adf489b2cc670fc6ded28df8d
    command: ["--log-bin", "--expire-logs-days=7"]
    restart: unless-stopped
    env_file: [ .env ]
    environment:
      MYSQL_ROOT_PASSWORD: ${CENTRAL_DB_PASS}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - ragenodes_net
    cpu_shares: 1024

  phpmyadmin:
    image: phpmyadmin@sha256:6db6e0bc9959eb00395f5d927cc786cb63530a265663950ecb9faf5955419c37
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 1000M
      PMA_ABSOLUTE_URI: ${PUBLIC_BASE_URL}/pma/
    volumes:
      - ./phpmyadmin-config/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    networks:
      - ragenodes_net
    depends_on:
      - mariadb

  fivem-base:
    build:
      context: ./fivem-base
    image: ${FIVEM_BASE_IMAGE}
    profiles: ["build-only"]
    command: ["true"]

  blender-web:
    build:
      context: ./blender-web
    image: ${BLENDER_BASE_IMAGE}
    profiles: ["build-only"]
    command: ["true"]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file: [ .env ]
    ports:
      - "127.0.0.1:3006:3006"
    networks:
      - ragenodes_net
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_started
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
      - ./fivem-base:/app/fivem-base
      - ./certs:/opt/ragenodes-ultimate/certs:ro
      - query_cache_data:/app/config-gateway/static
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3006/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    cpu_shares: 2048

  worker-backups:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file: [ .env ]
    environment:
      - RAGENODES_ROLE=worker-backups
    command: ["npm", "run", "worker:backups"]
    networks:
      - ragenodes_net
    depends_on:
      backend:
        condition: service_healthy
      mariadb:
        condition: service_started
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:ro
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
      - ./fivem-base:/app/fivem-base
      - ./certs:/opt/ragenodes-ultimate/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    cpu_shares: 1024

  worker-docker-events:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file: [ .env ]
    environment:
      - RAGENODES_ROLE=worker-docker-events
    command: ["npm", "run", "worker:docker-events"]
    networks:
      - ragenodes_net
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:ro
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
      - ./fivem-base:/app/fivem-base
      - ./certs:/opt/ragenodes-ultimate/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    cpu_shares: 1024

  worker-stats:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file: [ .env ]
    environment:
      - RAGENODES_ROLE=worker-stats
    command: ["npm", "run", "worker:stats"]
    networks:
      - ragenodes_net
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:ro
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src
      - ./rclone.conf:/root/.config/rclone/rclone.conf:ro
      - ./certs:/opt/ragenodes-ultimate/certs:ro
      - query_cache_data:/app/config-gateway/static
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    cpu_shares: 768

  oxide_control_panel:
    build:
      context: ./oxideproxy/node_panel
    image: ragenodes/oxide-control-panel:1.0.0-local
    restart: unless-stopped
    init: true
    environment:
      BACKEND_URL: http://backend:3006
      CONFIG_PATH: /app/rust_config/oxide_proxy.yml
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    networks:
      - ragenodes_net
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./oxideproxy/config:/app/rust_config
      - ./frontend/public/vendor:/app/public/vendor:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpu_shares: 256

  oxide_web:
    build:
      context: ./oxideproxy
    image: ragenodes/oxideproxy:1.0.0-local
    restart: unless-stopped
    networks:
      - ragenodes_net
    ports:
      - "80:80"
      - "443:80"
      - "8088:8088"
    volumes:
      - ./oxideproxy/config:/app/config
      - ./frontend/public:/var/www/frontend:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:/var/www/frontend/data:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:/var/www/frontend/data/templates:ro
      - query_cache_data:/var/www/query-cache:ro
    depends_on:
      backend:
        condition: service_healthy
      oxide_control_panel:
        condition: service_healthy
    cpu_shares: 2048

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      - API_URL_BASE=http://backend:3006/api/discord
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ragenodes_net

  tunnel:
    image: cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    restart: unless-stopped
    network_mode: host
    command: tunnel --protocol http2 --no-autoupdate run --token ${TUNNEL_TOKEN:-${CF_TUNNEL_TOKEN:-}}

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    networks:
      - ragenodes_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    cpu_shares: 512

networks:
  ragenodes_net:
    name: ragenodes_net

volumes:
  postgres_data:
  mariadb_data:
  redis_data:
  query_cache_data:

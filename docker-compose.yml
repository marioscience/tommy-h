services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ragenodes_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpu_shares: 1024

  mariadb:
    image: mariadb@sha256:de61fed4a40d3842f3ee09944ba52792156cfd9adf489b2cc670fc6ded28df8d
    command: ["--log-bin", "--expire-logs-days=7"]
    restart: unless-stopped
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      MYSQL_ROOT_PASSWORD: ${CENTRAL_DB_PASS}
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MARIADB_GAME_HOST_PORT:-3307}:3306"
    networks:
      - ragenodes_net
    cpu_shares: 1024

  phpmyadmin:
    image: phpmyadmin@sha256:6db6e0bc9959eb00395f5d927cc786cb63530a265663950ecb9faf5955419c37
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 1000M
      PMA_ABSOLUTE_URI: ${PUBLIC_BASE_URL}/pma/
    volumes:
      - ./phpmyadmin-config/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    networks:
      - ragenodes_net
    depends_on:
      - mariadb

  fivem-base:
    build:
      context: ./runtime-images/fivem
    image: ${FIVEM_BASE_IMAGE}
    profiles: ["build-only"]
    command: ["true"]

  blender-web:
    build:
      context: ./runtime-images/blender-web
    image: ${BLENDER_BASE_IMAGE}
    profiles: ["build-only"]
    command: ["true"]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-1000}"
      - "${GAME_DATA_GID:-1000}"
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      PORT_SCAN_LIMIT: ${PRODUCTION_PORT_SCAN_LIMIT:-999}
      PUBLIC_ENDPOINT_HOST: ${PUBLIC_ENDPOINT_HOST:-ragenodes.app}
      PUBLIC_ENDPOINT_SCHEME: ${PUBLIC_ENDPOINT_SCHEME:-https}
      PUBLIC_ENDPOINT_MODE: ${PUBLIC_ENDPOINT_MODE:-subdomain}
      PUBLIC_ENDPOINT_PREFIX: ${PUBLIC_ENDPOINT_PREFIX:-tx}
      GAME_DATABASE_HOST: ${GAME_DATABASE_HOST:-mariadb}
      GAME_DATABASE_PORT: ${GAME_DATABASE_PORT:-3306}
      PG_POOL_MAX: ${BACKEND_PG_POOL_MAX:-10}
    expose:
      - "3006"
    networks:
      - ragenodes_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_started
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src:ro
      - ./certs:/opt/ragenodes-ultimate/certs
      - query_cache_data:/app/config-gateway/static
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3006/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    pids_limit: 256
    cpu_shares: 2048

  worker-deployments:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-1000}"
      - "${GAME_DATA_GID:-1000}"
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      - RAGENODES_ROLE=worker-deployments
      - PUBLIC_ENDPOINT_HOST=${PUBLIC_ENDPOINT_HOST:-ragenodes.app}
      - PUBLIC_ENDPOINT_SCHEME=${PUBLIC_ENDPOINT_SCHEME:-https}
      - PUBLIC_ENDPOINT_MODE=${PUBLIC_ENDPOINT_MODE:-subdomain}
      - PUBLIC_ENDPOINT_PREFIX=${PUBLIC_ENDPOINT_PREFIX:-tx}
      - GAME_DATABASE_HOST=${GAME_DATABASE_HOST:-mariadb}
      - GAME_DATABASE_PORT=${GAME_DATABASE_PORT:-3306}
    command: ["node", "src/worker.js"]
    networks:
      - ragenodes_net
    depends_on:
      backend:
        condition: service_healthy
      mariadb:
        condition: service_started
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src:ro
      - ./certs:/opt/ragenodes-ultimate/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    pids_limit: 256
    cpu_shares: 1536

  worker-backups:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-1000}"
      - "${GAME_DATA_GID:-1000}"
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      - RAGENODES_ROLE=worker-backups
    command: ["node", "src/worker.js"]
    networks:
      - ragenodes_net
    depends_on:
      backend:
        condition: service_healthy
      mariadb:
        condition: service_started
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:ro
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src:ro
      - ./config/rclone:/app/config/rclone:ro
      - ./certs:/opt/ragenodes-ultimate/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    pids_limit: 128
    cpu_shares: 1024

  worker-docker-events:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-1000}"
      - "${GAME_DATA_GID:-1000}"
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      - RAGENODES_ROLE=worker-docker-events
      - PUBLIC_ENDPOINT_HOST=${PUBLIC_ENDPOINT_HOST:-ragenodes.app}
      - PUBLIC_ENDPOINT_SCHEME=${PUBLIC_ENDPOINT_SCHEME:-https}
      - PUBLIC_ENDPOINT_MODE=${PUBLIC_ENDPOINT_MODE:-subdomain}
      - PUBLIC_ENDPOINT_PREFIX=${PUBLIC_ENDPOINT_PREFIX:-tx}
    command: ["node", "src/worker.js"]
    networks:
      - ragenodes_net
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:ro
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src:ro
      - ./certs:/opt/ragenodes-ultimate/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 128
    cpu_shares: 1024

  worker-stats:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    group_add:
      - "${DOCKER_GID:-1000}"
      - "${GAME_DATA_GID:-1000}"
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      - RAGENODES_ROLE=worker-stats
      - PUBLIC_ENDPOINT_HOST=${PUBLIC_ENDPOINT_HOST:-ragenodes.app}
      - PUBLIC_ENDPOINT_SCHEME=${PUBLIC_ENDPOINT_SCHEME:-https}
      - PUBLIC_ENDPOINT_MODE=${PUBLIC_ENDPOINT_MODE:-subdomain}
      - PUBLIC_ENDPOINT_PREFIX=${PUBLIC_ENDPOINT_PREFIX:-tx}
    command: ["node", "src/worker.js"]
    networks:
      - ragenodes_net
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:${DOCKER_SOCKET:?Set DOCKER_SOCKET to a rootless daemon socket}:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:ro
      - ${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}:${BACKUP_ROOT:?Set BACKUP_ROOT to an absolute path}
      - ./backend/src:/app/src:ro
      - ./certs:/opt/ragenodes-ultimate/certs:ro
      - query_cache_data:/app/config-gateway/static
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    pids_limit: 128
    cpu_shares: 768

  oxide_control_panel:
    build:
      context: ./oxideproxy/node_panel
    image: ragenodes/oxide-control-panel:1.0.0-local
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      BACKEND_URL: http://backend:3006
      CONFIG_PATH: /app/game_config/oxide_proxy.yml
      OXIDE_LOG_DIR: /app/runtime/logs
      OXIDE_METRICS_PATH: /app/runtime/game_metrics.json
      OXIDE_DEFAULT_WEB_BACKEND: 127.0.0.1:3010
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OXIDE_ROUTE_API_KEY: ${DISCORD_API_KEY:?Set DISCORD_API_KEY}
    networks:
      - ragenodes_net
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./oxideproxy/config:/app/rust_config
      - ./oxideproxy/game_config:/app/game_config
      - ./frontend/public/vendor:/app/public/vendor:ro
      - oxide_game_runtime_data:/app/runtime:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpu_shares: 256

  oxide_game_runtime_init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    user: "0:0"
    # El plano de datos escribe como root para cargar XDP, mientras el panel
    # únicamente lee como APP_GID. El bit setgid mantiene ese grupo en cada
    # archivo/registro nuevo sin conceder acceso a otros usuarios del host.
    command: ["sh", "-c", "mkdir -p /runtime/logs && chown -R 0:${APP_GID:-1000} /runtime && chmod -R g+rX,o-rwx /runtime && chmod 2750 /runtime /runtime/logs"]
    volumes:
      - oxide_game_runtime_data:/runtime
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    restart: "no"

  oxide_game:
    build:
      context: ./oxideproxy
    image: ragenodes/oxideproxy:1.0.0-local
    restart: unless-stopped
    # El cargador XDP necesita un proceso uid 0, pero se mantiene confinado:
    # filesystem de solo lectura y únicamente tres capacidades del kernel.
    user: "0:0"
    network_mode: host
    environment:
      - OXIDE_LOG_DIR=/app/runtime/logs
      - OXIDE_METRICS_PATH=/app/runtime/game_metrics.json
      - OXIDE_CONFIG_PATH=/app/game_config/oxide_proxy.yml
      - OXIDE_EXIT_ON_CONFIG_CHANGE=true
      - OXIDE_XDP_OWNER=true
      - OXIDE_XDP_INTERFACE=${OXIDE_XDP_INTERFACE:-eth0}
    volumes:
      - ./oxideproxy/game_config:/app/game_config:ro
      - oxide_game_runtime_data:/app/runtime
    depends_on:
      backend:
        condition: service_healthy
      oxide_game_runtime_init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, BPF, PERFMON]
    cpu_shares: 1024

  oxide_web:
    build:
      context: ./oxideproxy
    image: ragenodes/oxideproxy:1.0.0-local
    restart: unless-stopped
    user: "65532:65532"
    networks:
      - ragenodes_net
    ports:
      - "${PROXY_BIND_IP:-127.0.0.1}:80:80"
      - "${PROXY_BIND_IP:-127.0.0.1}:443:8443"
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${HOST_BIND_FRONTEND_PORT:-8088}:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - STAGING_MODE=${STAGING_MODE:-false}
      - STAGING_UPSTREAM=${STAGING_UPSTREAM:-}
      - STAGING_DOMAINS=${STAGING_DOMAINS:-ragenodes.dev,panel.ragenodes.dev}
      - STAGING_TLS_UPSTREAM=${STAGING_TLS_UPSTREAM:-}
      - STAGING_TLS_DOMAINS=${STAGING_TLS_DOMAINS:-ragenodes.dev}
      - OXIDE_ACME_ENABLED=${OXIDE_ACME_ENABLED:-false}
      - OXIDE_ACME_DOMAINS=${OXIDE_ACME_DOMAINS:-}
      - OXIDE_ACME_EMAIL=${OXIDE_ACME_EMAIL:-}
      - OXIDE_ACME_PRODUCTION=${OXIDE_ACME_PRODUCTION:-false}
      - OXIDE_ACME_CACHE_DIR=/app/acme
      - OXIDE_DYNAMIC_WEB_DOMAINS=${OXIDE_DYNAMIC_WEB_DOMAINS:-ragenodes.app,ragenodes.dev,ragenodes.com,node1.ragenodes.com}
      - OXIDE_DYNAMIC_BACKEND_HOST=${OXIDE_DYNAMIC_BACKEND_HOST:-host.docker.internal}
      - STAGING_DYNAMIC_DOMAIN=${STAGING_DYNAMIC_DOMAIN:-ragenodes.dev}
      - OXIDE_DYNAMIC_STAGING_BACKEND_HOST=${OXIDE_DYNAMIC_STAGING_BACKEND_HOST:-}
      - OXIDE_TXADMIN_PORT_START=${OXIDE_TXADMIN_PORT_START:-40100}
      - OXIDE_TXADMIN_PORT_END=${OXIDE_TXADMIN_PORT_END:-59999}
      - OXIDE_BLENDER_PORT_START=${OXIDE_BLENDER_PORT_START:-50100}
      - OXIDE_BLENDER_PORT_END=${OXIDE_BLENDER_PORT_END:-59999}
      - OXIDE_FRAME_ANCESTORS=${OXIDE_FRAME_ANCESTORS:-https://ragenodes.com https://www.ragenodes.com https://panel.ragenodes.app https://ragenodes.dev https://panel.ragenodes.dev https://staging.ragenodes.com}
      - ACCESS_GATE_ENABLED=${ACCESS_GATE_ENABLED:-true}
      - ACCESS_GATE_DOMAIN=${ACCESS_GATE_DOMAIN:-ragenodes.dev}
      - ACCESS_GATE_SHARED_EDGE=${ACCESS_GATE_SHARED_EDGE:-true}
      - ACCESS_GATE_ALLOWED_EMAIL_DOMAIN=${ACCESS_GATE_ALLOWED_EMAIL_DOMAIN:-ragenodes.com}
      - ACCESS_GATE_ALLOWED_EMAILS=${ACCESS_GATE_ALLOWED_EMAILS:-}
      - ACCESS_GATE_SESSION_SECRET=${ACCESS_GATE_SESSION_SECRET:-}
      - ACCESS_GATE_REDIS_URL=${ACCESS_GATE_REDIS_URL:-redis://redis:6379/0}
      - ACCESS_GATE_FROM_EMAIL=${ACCESS_GATE_FROM_EMAIL:-RageNodes Access <info@ragenodes.com>}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - OXIDE_RUNTIME_BLACKLIST_PATH=/app/runtime/runtime-blacklist.txt
      - OXIDE_XDP_OWNER=false
      - OXIDE_API_BACKEND=${OXIDE_API_BACKEND:-backend:3006}
      - OXIDE_API_DNS_TTL_SECONDS=${OXIDE_API_DNS_TTL_SECONDS:-5}
      - OXIDE_API_FAILURE_COOLDOWN_SECONDS=${OXIDE_API_FAILURE_COOLDOWN_SECONDS:-5}
    volumes:
      - ./oxideproxy/config/oxide_proxy.yml:/app/config/oxide_proxy.yml:ro
      - oxide_acme_data:/app/acme
      - oxide_runtime_data:/app/runtime
      - ./frontend/public:/var/www/frontend:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}:/var/www/frontend/data:ro
      - ${INSTANCE_DATA_ROOT:?Set INSTANCE_DATA_ROOT to an absolute path}/templates:/var/www/frontend/data/templates:ro
      - query_cache_data:/var/www/query-cache:ro
    depends_on:
      backend:
        condition: service_healthy
      oxide_control_panel:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    cpu_shares: 2048

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file: [ "${RAGENODES_ENV_FILE:-.env}" ]
    environment:
      - API_URL_BASE=http://backend:3006/api/discord
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ragenodes_net
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    networks:
      - ragenodes_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    cpu_shares: 512

networks:
  ragenodes_net:
    name: ragenodes_net

volumes:
  postgres_data:
  mariadb_data:
  redis_data:
  query_cache_data:
  oxide_acme_data:
  oxide_runtime_data:
  oxide_game_runtime_data:
